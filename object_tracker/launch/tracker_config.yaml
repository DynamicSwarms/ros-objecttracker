/tracker: # name of node
  ros__parameters:
    # Single-marker objects have no valid orientation and therefore normally use /cf_positions.
    publishSingleMarkerObjectsToTf: false
    pointCloud2TopicName: "pointCloud"
    logEnabled: false
    latencyThreshold: 0.035 # seconds
    tfBroadcastRate: 20 # Hz
    numMarkerConfigurations: 2
    markerConfigurations:
      "0":  # for standard Crazyflie
        numPoints: 4
        offset: [0.0, -0.01, -0.04]
        points:
          "0": [0.0177184,0.0139654,0.0557585]
          "1": [-0.0262914,0.0509139,0.0402475]
          "2": [-0.0328889,-0.02757,0.0390601]
          "3": [0.0431307,-0.0331216,0.0388839]
      "1": # for single marker object only offset is used
        numPoints: 1
        offset: [ 0.0, 0.0, 0.02 ]
        points:
          "0": [ 0.0, 0.0, 0.0 ]
    numDynamicsConfigurations: 1
    dynamicsConfigurations:
      "0":
        maxXVelocity: 2.0
        maxYVelocity: 2.0
        maxZVelocity: 3.0
        maxPitchRate: 20.0
        maxRollRate: 20.0
        maxYawRate: 10.0
        maxRoll: 1.4
        maxPitch: 1.4
        maxFitnessScore: 0.001
